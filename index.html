<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Today's Practice</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#995F2F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Today's Practice" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Open+Sans:wght@300;400;600&family=Dancing+Script:wght@700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />

  <style>
    /* ─── Design Tokens ─────────────────────────────── */
    :root {
      --orange:     #EC671B;
      --terracotta: #D2691E;
      --blue:       #1B6EC8;
      --crimson:    #C83232;
      --brown:      #8B5E3C;
      --bg:         #F4EFE6;
      --card:       #FFFFFF;
      --cream:      #FCEFE0;
      --cream-2:    #F7E4CF;
      --dark:       #2A1E14;
      --mid:        #5A4A3C;
      --light:      #A6957F;
      --border:     #E7DCCB;
      --muted:      #EFE7D9;
      --success:    #2E7D32;
      --font-head:  'Roboto', sans-serif;
      --font-body:  'Open Sans', sans-serif;
      --font-serif: 'Lora', Georgia, serif;
      --radius:     16px;
      --shadow:     0 2px 14px rgba(90,60,30,0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* App-shell layout: header + scrollable view + tab bar, no page scroll */
    html, body { height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }

    /* ─── Header ─────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding:
        calc(env(safe-area-inset-top) + 12px)
        max(20px, env(safe-area-inset-right)) 12px
        max(20px, env(safe-area-inset-left));
      background: linear-gradient(160deg, #8A5226 0%, #995F2F 55%, #A86B36 100%);
      flex-shrink: 0;
      transition: box-shadow 0.3s;
      z-index: 20;
    }
    .header.scrolled { box-shadow: 0 3px 22px rgba(90,40,10,0.35); }

    /* ─── Views + tab bar ────────────────────────────── */
    .app-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .view.hidden { display: none; }

    /* Floating pill tab bar */
    .tab-bar {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 14px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px;
      background: rgba(252,250,246,0.96);
      border: 1.5px solid rgba(236,103,27,0.28);
      border-radius: 999px;
      box-shadow: 0 8px 28px rgba(60,35,15,0.22);
      backdrop-filter: blur(10px);
      z-index: 50;
    }
    .tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      min-width: 48px;
      padding: 0 14px;
      background: none;
      border: none;
      border-radius: 999px;
      color: #6f6f73;
      font-size: 15px;
      font-family: var(--font-head);
      font-weight: 700;
      transition: background 0.2s, color 0.2s, padding 0.2s;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .tab .tab-lbl { display: none; }
    .tab.active {
      background: linear-gradient(135deg, #EC671B, #D2691E);
      color: #fff;
      padding: 0 20px 0 16px;
    }
    .tab.active .tab-lbl { display: inline; }
    .tab svg { width: 22px; height: 22px; }
    .header-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .header-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    /* soft, warm, never alarming */
    .header-left {
      background: none; border: none; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; gap: 6px;
      text-align: right;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(255,255,255,0.65);
      font-weight: 400;
    }
    .header-left b {
      font-weight: 600;
      color: rgba(255,255,255,0.92);
    }

    /* ─── Single calm column ─────────────────────────── */
    .stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px 18px calc(env(safe-area-inset-bottom) + 84px);
      min-height: 100%;
    }
    .card { width: 100%; max-width: 460px; display: flex; flex-direction: column; }
    #view-today { display: flex; flex-direction: column; overflow: hidden; }
    #view-today.hidden { display: none; }

    /* ─── Compact hero: left col + right col ─────────── */
    .hero-flex {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }
    .hero-left  { flex: 1; min-width: 0; }
    .hero-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .greeting {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 24px;
      color: var(--dark);
      letter-spacing: -0.2px;
    }
    .today-date {
      font-size: 13px;
      color: var(--mid);
      margin-top: 3px;
      margin-bottom: 14px;
    }

    /* 4 live completion dots — left col, below date */
    .today-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tdot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(140,94,60,0.18);
      transition: background 0.25s, transform 0.2s;
      flex-shrink: 0;
    }
    .tdot.on              { transform: scale(1.15); }
    .tdot.on.td-surya     { background: var(--orange); }
    .tdot.on.td-shambhavi { background: var(--crimson); }
    .tdot.on.td-bhuta     { background: var(--blue); }
    .tdot.on.td-devi      { background: var(--brown); }
    .tdot-label {
      font-size: 11px;
      color: var(--light);
      margin-left: 2px;
      font-weight: 600;
    }

    /* Day progress ring — right col */
    .day-ring {
      position: relative;
      width: 74px; height: 74px;
    }
    .day-ring svg {
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .ring-bg, .ring-fg {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
    }
    .ring-bg { stroke: rgba(140,94,60,0.14); }
    .ring-fg {
      stroke: var(--orange);
      stroke-dasharray: 194.8;
      stroke-dashoffset: 194.8;
      transition: stroke-dashoffset 0.9s ease;
    }
    .ring-center {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ring-num {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: 26px;
      line-height: 1;
      color: var(--orange);
      letter-spacing: -0.5px;
    }
    .best-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--light);
      letter-spacing: 0.3px;
      margin-right: 2px;
    }
    .ring-lbl {
      font-size: 8px;
      letter-spacing: 1.4px;
      font-weight: 700;
      color: var(--light);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ─── Practice cards (tap to complete) ───────────── */
    .practices { display: flex; flex-direction: column; gap: 12px; }

    .pcard {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 17px 18px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.22s, border-color 0.22s, transform 0.12s;
    }
    .pcard.tap { cursor: pointer; }
    .pcard.tap:active { transform: scale(0.985); }

    .pcard.s-surya     { --pc: var(--orange); }
    .pcard.s-shambhavi { --pc: var(--crimson); }
    .pcard.s-bhuta     { --pc: var(--blue); }
    .pcard.s-devi      { --pc: var(--brown); }

    /* done = warm, filled, glad — never a grey toggle */
    .pcard.done                  { border-color: rgba(140,94,60,0.35); background: #FBF5EE; }
    .pcard.done.s-surya          { border-color: rgba(236,103,27,0.4); background: #FFF5EE; }
    .pcard.done.s-shambhavi      { border-color: rgba(200,50,50,0.35); background: #FFF2F2; }
    .pcard.done.s-bhuta          { border-color: rgba(27,110,200,0.35); background: #F0F5FF; }
    .pcard.done.s-devi           { border-color: rgba(139,94,60,0.40); background: #FBF6F0; }

    .pglyph-chip {
      width: 46px; height: 46px;
      flex-shrink: 0;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.22s;
    }
    .pcard.s-surya     .pglyph-chip { background: rgba(236,103,27,0.10); }
    .pcard.s-shambhavi .pglyph-chip { background: rgba(200,50,50,0.09); }
    .pcard.s-bhuta     .pglyph-chip { background: rgba(27,110,200,0.09); }
    .pcard.s-devi      .pglyph-chip { background: rgba(139,94,60,0.11); }
    .pglyph {
      width: 26px; height: 26px;
      flex-shrink: 0;
      color: var(--pc);
      transition: transform 0.2s;
    }
    .pcard.done .pglyph { transform: scale(1.1); }

    .pmeta { flex: 1; min-width: 0; }
    .pname {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 15.5px;
      color: var(--dark);
    }
    .pdesc {
      font-size: 12px;
      color: var(--light);
      margin-top: 2px;
    }

    /* completion ring on the right (inviting, not a switch) */
    .pcheck {
      width: 28px; height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 2px solid var(--border);
      position: relative;
      transition: all 0.22s;
    }
    .pcard.done .pcheck {
      background: var(--pc);
      border-color: var(--pc);
      animation: pop 0.32s ease;
    }
    .pcard.done .pcheck::after {
      content: '✓';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; font-weight: 700;
    }
    @keyframes pop {
      0% { transform: scale(0.7); }
      55% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    /* Surya cycle counter (kept — useful in-session info) */
    .counter { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
    .cbtn {
      width: 32px; height: 32px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: 50%;
      font-size: 18px; line-height: 1;
      color: var(--mid);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .cbtn:active { background: var(--muted); }
    .cval {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: 22px;
      width: 22px;
      text-align: center;
      color: var(--orange);
    }

    /* ─── Sadhguru quote ────────────────────────────── */
    .quote-card {
      margin-top: 4px;
      margin-bottom: 20px;
      padding: 4px 4px 0;
      position: relative;
    }
    .quote-card::before {
      content: '\201C';
      position: absolute;
      top: -10px; left: 0;
      font-size: 64px;
      line-height: 1;
      color: var(--orange);
      opacity: 0.4;
      font-family: Georgia, serif;
    }
    .quote-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 15px;
      line-height: 1.6;
      color: var(--mid);
      text-align: center;
      margin-top: 18px;
      padding: 0 10px;
    }
    .quote-sig {
      font-family: 'Dancing Script', cursive;
      font-size: 22px;
      color: var(--orange);
      text-align: right;
      margin-top: 10px;
      opacity: 0.85;
    }

    /* ─── CTA ─────────────────────────────────────────── */
    .cta-wrap { margin-top: auto; padding-top: 18px; }
    .cta {
      width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #EC671B, #D2691E);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.12s, box-shadow 0.2s;
    }
    .cta:not(:disabled):active { transform: scale(0.99); }
    .cta:not(:disabled) { box-shadow: 0 6px 20px rgba(236,103,27,0.28); }
    .cta:disabled {
      background: var(--muted);
      color: var(--light);
      cursor: default;
    }
    .cta.pulse { animation: ctaPulse 0.5s ease; }
    @keyframes ctaPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    .save-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
      color: var(--light);
    }
    .save-msg.ok  { color: var(--success); font-weight: 600; }
    .save-msg.err { color: var(--terracotta); font-weight: 600; }

    /* ─── History section ───────────────────────────── */
    .history {
      background: var(--muted);
      padding: 22px 18px calc(env(safe-area-inset-bottom) + 96px);
      display: flex;
      justify-content: center;
      min-height: 100%;
    }
    .history-inner {
      width: 100%;
      max-width: 460px;
    }
    .history-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .history-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 15px;
      color: var(--dark);
    }
    .history-range {
      font-size: 11px;
      color: var(--light);
    }

    /* Stats row */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px 7px;
    }
    .stat-num {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: 18px;
      line-height: 1;
    }
    .stat-lbl {
      font-size: 9.5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--light);
      margin-top: 4px;
    }

    /* Legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 16px;
    }
    .leg-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--mid);
    }
    .leg-glyph { width: 16px; height: 16px; }
    .leg-glyph.s-surya     { color: var(--orange); }
    .leg-glyph.s-shambhavi { color: var(--crimson); }
    .leg-glyph.s-bhuta     { color: var(--blue); }
    .leg-glyph.s-devi      { color: var(--brown); }

    /* ─── Heatmap strip ─────────────────────────────── */
    .heat-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 12px 10px;
      margin-bottom: 14px;
    }
    .heat-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .heat-scroll::-webkit-scrollbar { display: none; }
    .heat-inner { display: inline-block; min-width: 100%; }
    .heat-months { position: relative; height: 14px; font-size: 9.5px; color: var(--light); margin-left: 0; }
    .heat-months span { position: absolute; top: 0; }
    .heat-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 13px);
      grid-auto-columns: 13px;
      gap: 3px;
    }
    .hc { width: 13px; height: 13px; border-radius: 3px; background: var(--muted); }
    .hc.l1 { background: #F8D9BE; }
    .hc.l2 { background: #F4B57F; }
    .hc.l3 { background: #EC8B4B; }
    .hc.l4 { background: #D9540F; }
    .hc.today { outline: 1.5px solid var(--dark); outline-offset: 1px; }
    .hc.pad, .hc.future { visibility: hidden; }
    .heat-legend {
      display: flex; align-items: center; justify-content: flex-end; gap: 4px;
      font-size: 9.5px; color: var(--light); margin-top: 8px;
    }
    .heat-legend .hc { width: 11px; height: 11px; }

    /* ─── Month calendar ────────────────────────────── */
    .cal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 18px 0 10px;
    }
    .cal-title { font-family: var(--font-head); font-weight: 700; font-size: 15px; }
    .cal-nav {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      font-size: 18px; color: var(--mid);
      display: flex; align-items: center; justify-content: center;
    }
    .cal-nav:disabled { opacity: 0.3; }
    .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-dow { font-size: 10px; color: var(--light); text-align: center; margin-bottom: 5px; }
    .cal-cell {
      aspect-ratio: 1 / 1.08;
      border-radius: 10px;
      background: var(--muted);
      border: 1.5px solid transparent;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-family: var(--font-head); font-weight: 700; font-size: 13px; color: var(--dark);
      -webkit-tap-highlight-color: transparent;
    }
    .cal-cell.empty { background: none; }
    .cal-cell.l1 { background: #FBE7D3; }
    .cal-cell.l2 { background: #F8CDA6; }
    .cal-cell.l3 { background: #F2A870; }
    .cal-cell.l4 { background: #E9783A; color: #fff; }
    .cal-cell.today { border-color: var(--dark); }
    .cal-cell.future { opacity: 0.35; pointer-events: none; }
    .cal-cell.fixable { border: 1.5px dashed var(--orange); }
    .cal-cell.restored { border-style: dashed; border-color: var(--brown); }
    .cal-cell.restored::after { content: '★'; position: absolute; top: 1px; right: 3px; font-size: 8px; color: var(--brown); }
    .cal-dots { display: flex; gap: 2px; }
    .cal-dots i { width: 4px; height: 4px; border-radius: 50%; background: rgba(42,30,20,0.15); }
    .cal-cell.l4 .cal-dots i { background: rgba(255,255,255,0.35); }
    .cal-dots i.on { background: var(--dark); }
    .cal-cell.l4 .cal-dots i.on { background: #fff; }

    /* ─── Ticket wallet ─────────────────────────────── */
    .wallet-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .wallet-sub { font-size: 11px; color: var(--light); margin-bottom: 8px; }
    .wrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--muted); }
    .wrow .leg-glyph { width: 22px; height: 22px; flex-shrink: 0; }
    .wname { flex: 1; min-width: 0; font-family: var(--font-head); font-weight: 700; font-size: 13px; }
    .wname small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 10.5px; color: var(--light); margin-top: 1px; }
    .wown { font-family: var(--font-head); font-weight: 900; font-size: 15px; color: var(--mid); min-width: 28px; text-align: right; }
    .btn-sm {
      padding: 8px 12px; border-radius: 999px; border: none;
      background: var(--orange); color: #fff;
      font-family: var(--font-head); font-weight: 700; font-size: 12px;
      white-space: nowrap;
    }
    .btn-sm:disabled { background: var(--muted); color: var(--light); }
    .btn-sm.ghost { background: transparent; color: var(--orange); border: 1.5px solid var(--orange); }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px);
      transform: translate(-50%, 20px); opacity: 0;
      background: var(--dark); color: #fff; font-size: 13px;
      padding: 10px 16px; border-radius: 999px; z-index: 300;
      transition: all 0.25s; pointer-events: none; max-width: 90%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Day sheet extras */

};

const PRACTICES = ['surya', 'shambhavi', 'bhuta', 'devi'];
const PNAME = {
  surya: 'Surya Kriya', shambhavi: 'Shambhavi Mahamudra',
  bhuta: 'Bhuta Shuddhi', devi: 'Devi Sadhana',
};
const PCOLOR = {
  surya: 'var(--orange)', shambhavi: 'var(--crimson)',
  bhuta: 'var(--blue)', devi: 'var(--brown)',
};
const DATA_KEY = 'sadhana-tracker-data';
const TICKET_KEY = 'sadhana-tickets';

/* ============================================================
   STATE
   ============================================================ */
const S = {
  cycles: 0,
  shambhavi: false,
  bhuta: false,
  devi: false,
  data: {},        // { 'YYYY-MM-DD': { cycles, shambhavi, bhuta, devi, restored[] } }
  tickets: [],     // { id, practice, boughtOn, usedFor, usedAt }
  todayKey: '',
  viewMonth: null, // Date (1st of month) shown in the calendar
  sheetKey: null,  // day currently open in the sheet
  pickCycles: 1,
};

/* ============================================================
   DATE HELPERS
   ============================================================ */
function parseLocal(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function toKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function todayKey() { return toKey(new Date()); }
function addDays(key, n) {
  const d = parseLocal(key);
  d.setDate(d.getDate() + n);
  return toKey(d);
}
function daysBetween(a, b) {
  return Math.round((parseLocal(b) - parseLocal(a)) / 864e5);
}
function journeyStart() {
  let min = CFG.START_DATE;
  Object.keys(S.data).forEach(k => { if (k < min && hasContent(S.data[k])) min = k; });
  return min;
}
function dayNum(key) { return daysBetween(journeyStart(), key) + 1; }
function mondayIndex(date) { return (date.getDay() + 6) % 7; }

/* ============================================================
   PRACTICE / SCORING HELPERS
   ============================================================ */
function isDone(d, p) {
  if (!d) return false;
  return p === 'surya' ? Number(d.cycles) >= 1 : !!d[p];
}
function doneCount(d) { return PRACTICES.filter(p => isDone(d, p)).length; }
function isRestored(d, p) { return !!d && Array.isArray(d.restored) && d.restored.includes(p); }
function hasContent(o) {
  return !!o && (o.cycles > 0 || o.shambhavi || o.bhuta || o.devi);
}

/* Streak counts back from today; a not-yet-logged today doesn't break it. */
function currentStreak() {
  let key = S.todayKey;
  if (!doneCount(S.data[key])) key = addDays(key, -1);
  let n = 0;
  while (doneCount(S.data[key]) > 0) { n++; key = addDays(key, -1); }
  return n;
}

function computeStats() {
  const start = journeyStart();
  const total = daysBetween(start, S.todayKey);
  let best = 0, run = 0, days = 0, earned = 0;
  for (let i = 0; i <= total; i++) {
    const d = S.data[addDays(start, i)];
    const c = doneCount(d);
    if (c > 0) { run++; days++; best = Math.max(best, run); } else run = 0;
    if (d) {
      const genuine = PRACTICES.filter(p => isDone(d, p) && !isRestored(d, p)).length;
      earned += genuine + (genuine === 4 ? 2 : 0);
    }
  }
  const points = earned - CFG.TICKET_COST * S.tickets.length;
  return { streak: currentStreak(), best, days, points, earned };
}

function nextMilestone(streak) {
  const m = CFG.MILESTONES.find(x => x > streak);
  return m || (Math.floor(streak / 365) + 1) * 365;
}

/* ============================================================
   INIT
   ============================================================ */
const QUOTES = [
  "Do not just learn from your failures; learn not to fail. Whatever you aspire for, figure out how to make it happen. Life is your Karma – it is your Making.",
  "The most beautiful moments in life are moments when you are expressing your joy, not when you are seeking it.",

  "The quality of your life depends on how well you manage your body, mind, emotions, and the world around you.",
  "Whatever you do, do it with total involvement – that is all that matters.",

  "Sadhana is not a ritual. It is your longing to include everything in your experience.",

];
function setDailyQuote() {

function init() {
  S.todayKey = todayKey();
  const now  = new Date();
  S.viewMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  setDailyQuote();

  loadData();
}

/* Hero ring (streak → next milestone) + header (points, day count) */
function refreshHero() {
  const st = computeStats();
  document.getElementById('day-num').textContent = st.streak;
  document.getElementById('hstreak').classList.toggle('lit', doneCount(S.data[S.todayKey]) > 0);
  document.getElementById('header-left').innerHTML =
    `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/></svg><span><b>◆ ${st.points}</b></span>`;
}

/* ============================================================
   PRACTICE INTERACTIONS
   ============================================================ */
function toggleP(name) {
  S[name] = !S[name];
  buzz(10);
  renderCards();
}

function adjCycles(d) {
  S.cycles = Math.max(0, Math.min(3, S.cycles + d));
  buzz(10);
  renderCards();
}

function renderCards() {
  document.getElementById('cval').textContent = S.cycles;

  const state = {
    surya:     S.cycles >= 1,
    shambhavi: S.shambhavi,
    bhuta:     S.bhuta,
    devi:      S.devi,
  };

  Object.entries(state).forEach(([k, on]) => {
    document.getElementById('pc-' + k).classList.toggle('done', on);
  });

  document.getElementById('cta').disabled =
    !(state.surya || state.shambhavi || state.bhuta || state.devi);
}

/* Haptic feedback (Android; ignored elsewhere) */
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch(e) {} }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ============================================================
   LOAD / SYNC
   ============================================================ */
function persist() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(S.data));
    localStorage.setItem(TICKET_KEY, JSON.stringify(S.tickets));
  } catch(e) { console.warn('Cache write failed:', e.message); }
}

function loadData() {
  try {
    const stored = localStorage.getItem(DATA_KEY);
    if (stored) S.data = JSON.parse(stored);
    const t = localStorage.getItem(TICKET_KEY);
    if (t) S.tickets = JSON.parse(t);
  } catch(e) { console.warn('Cache read failed:', e.message); }
  fillToday();
  refreshHero();
  renderYatra();
  syncFromCloud();
}

function fillToday() {
  const td = S.data[S.todayKey];
  if (td) {
    S.cycles    = Number(td.cycles) || 0;
    S.shambhavi = !!td.shambhavi;
    S.bhuta     = !!td.bhuta;
    S.devi      = !!td.devi;
  }
  renderCards();
}

function normalizeDate(v) {
  if (!v) return '';
  if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v);
  return isNaN(d) ? '' : toKey(d);
}

function cloudOn() { return CFG.SCRIPT_URL && CFG.SCRIPT_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL'; }
const asBool = v => v === true || v === 'TRUE';

async function syncFromCloud() {
  if (!cloudOn()) return;
  try {
    const r = await fetch(CFG.SCRIPT_URL + '?action=get');
    const j = await r.json();
    let changed = false;

    (j.data || []).forEach(row => {
      let key, entry;
      if (Array.isArray(row)) {
        key = normalizeDate(row[0]);
        entry = {
          cycles: Number(row[1]) || 0,
          shambhavi: asBool(row[2]), bhuta: asBool(row[3]), devi: asBool(row[4]),
          restored: String(row[5] || '').split(',').filter(Boolean),
        };
      } else if (row && typeof row === 'object') {
        key = normalizeDate(row.date);
        entry = {
          cycles: Number(row.surya_cycles != null ? row.surya_cycles : row.cycles) || 0,
          shambhavi: asBool(row.shambhavi), bhuta: asBool(row.bhuta), devi: asBool(row.devi),
          restored: Array.isArray(row.restored) ? row.restored : String(row.restored || '').split(',').filter(Boolean),
        };
      }
      if (!key) return;
      const local = S.data[key];
      if (!local || key === S.todayKey) {
        // today is edited here, so the cloud only fills a gap
        if (!local || (!hasContent(local) && hasContent(entry))) { S.data[key] = entry; changed = true; }
        return;
      }
      // Past days only ever gain practices (a repair on either side is kept)
      S.data[key] = {
        cycles:    Math.max(local.cycles || 0, entry.cycles),
        shambhavi: !!local.shambhavi || entry.shambhavi,
        bhuta:     !!local.bhuta     || entry.bhuta,
        devi:      !!local.devi      || entry.devi,
        restored:  [...new Set([...(local.restored || []), ...entry.restored])],
      };
      changed = true;
    });

    (j.tickets || []).forEach(ct => {
      if (!ct || !ct.id) return;
      const lt = S.tickets.find(t => t.id === ct.id);
      if (!lt) { S.tickets.push(ct); changed = true; }
      else if (!lt.usedFor && ct.usedFor) { lt.usedFor = ct.usedFor; lt.usedAt = ct.usedAt; changed = true; }
    });

    if (changed) {
      persist();
      fillToday();
      refreshHero();
      renderYatra();
    }
  } catch(e) {
    console.log('Cloud offline — using cached data.', e.message);
  }
}

/* ============================================================
   SAVE
   ============================================================ */
async function postJSON(payload) {
  if (!cloudOn()) return true;
  try {
    const r = await fetch(CFG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const j = JSON.parse(await r.text());
    if (!j.success) throw new Error(j.error || 'Server rejected the request');
    return true;
  } catch(e) {
    console.warn('Cloud save failed. Check Apps Script deployment.', e.message);
    return false;
  }
}
const postDay = entry => postJSON(entry);
const postTicket = t => postJSON({ action: 'ticket', ...t });

async function saveToday() {
  const btn = document.getElementById('cta');
  const msg = document.getElementById('save-msg');

  const entry = {
    date:      S.todayKey,
    cycles:    S.cycles,
    shambhavi: S.shambhavi,
    bhuta:     S.bhuta,
    devi:      S.devi,
    restored:  (S.data[S.todayKey] && S.data[S.todayKey].restored) || [],
  };

  // Local cache first — always works, the day is never lost
  S.data[S.todayKey] = entry;
  persist();
  refreshHero();
  renderYatra();

  btn.disabled = true;
  document.getElementById('cta-text').textContent = 'Saving…';
  const ok = await postDay(entry);
  if (ok) {
    msg.className = 'save-msg ok';
    msg.textContent = 'Saved ✔';
    celebrate(btn);
  } else {
    msg.className = 'save-msg err';
    msg.textContent = '✓ Saved on device · cloud sync failed';
  }
  btn.disabled = false;
  document.getElementById('cta-text').textContent = 'Shambhoo';
  setTimeout(() => { msg.textContent = ''; msg.className = 'save-msg'; }, 3500);
}

function celebrate(btn) {
  btn.classList.remove('pulse');
  void btn.offsetWidth;
  btn.classList.add('pulse');
  buzz(15);
}

/* ============================================================
   YATRA — heatmap, month calendar, wallet
   ============================================================ */
function shortDate(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function renderYatra() {
  renderHeatmap();
  renderMonth();
}

function renderHeatmap() {
  const grid   = document.getElementById('heat-grid');
  const months = document.getElementById('heat-months');
  const start  = journeyStart();
  const first  = parseLocal(start);
  first.setDate(first.getDate() - mondayIndex(first));        // Monday of the first week
  const firstKey = toKey(first);
  const weeks  = Math.floor(daysBetween(firstKey, S.todayKey) / 7) + 1;
  const COL = 16;                                             // 13px cell + 3px gap

  let cells = '', labels = '', lastMonth = -1;
  for (let w = 0; w < weeks; w++) {
    for (let r = 0; r < 7; r++) {
      const key = addDays(firstKey, w * 7 + r);
      if (key < start) { cells += '<div class="hc pad"></div>'; continue; }
      if (key > S.todayKey) { cells += '<div class="hc future"></div>'; continue; }
      const d = S.data[key];
      cells += `<div class="hc l${doneCount(d)}${key === S.todayKey ? ' today' : ''}" data-key="${key}"></div>`;
    }
    const sunday = parseLocal(addDays(firstKey, w * 7 + 6));
    if (sunday.getMonth() !== lastMonth) {
      labels += `<span style="left:${w * COL}px">${sunday.toLocaleDateString('en-US', { month: 'short' })}</span>`;
      lastMonth = sunday.getMonth();
    }
  }
  grid.innerHTML = cells;
  months.innerHTML = labels;
  months.style.width = weeks * COL + 'px';

  const done = computeStats().days;
  document.getElementById('history-range').textContent = `${done} / ${CFG.GOAL_DAYS}`;
  const pct = Math.min(100, done / CFG.GOAL_DAYS * 100);
  document.getElementById('goal-fill').style.width = pct + '%';
  document.getElementById('goal-sub').textContent = `${Math.max(0, CFG.GOAL_DAYS - done)} days to go`;
}
document.getElementById('heat-grid').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.key;
  if (k) openDay(k);
});

function inRepairWindow(key) {
  return key < S.todayKey && daysBetween(key, S.todayKey) <= CFG.REPAIR_WINDOW_DAYS;
}

function shiftMonth(n) {
  S.viewMonth = new Date(S.viewMonth.getFullYear(), S.viewMonth.getMonth() + n, 1);
  renderMonth();
}

function renderMonth() {
  const vm = S.viewMonth;
  document.getElementById('cal-title').textContent =
    vm.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const startM = parseLocal(journeyStart());
  const now = parseLocal(S.todayKey);
  const vmIdx = vm.getFullYear() * 12 + vm.getMonth();
  document.getElementById('cal-prev').disabled = vmIdx <= startM.getFullYear() * 12 + startM.getMonth();
  document.getElementById('cal-next').disabled = vmIdx >= now.getFullYear() * 12 + now.getMonth();

  const daysIn = new Date(vm.getFullYear(), vm.getMonth() + 1, 0).getDate();
  let html = '<div class="cal-cell empty"></div>'.repeat(mondayIndex(vm));
  for (let day = 1; day <= daysIn; day++) {
    const key = toKey(new Date(vm.getFullYear(), vm.getMonth(), day));
    const d = S.data[key];
    const lvl = doneCount(d);
    const cls = ['cal-cell', 'l' + lvl];
    if (key === S.todayKey) cls.push('today');
    if (key > S.todayKey) cls.push('future');
    if (d && Array.isArray(d.restored) && d.restored.length) cls.push('restored');
    else if (lvl === 0 && inRepairWindow(key)) cls.push('fixable');
    const dots = PRACTICES.map(p => `<i class="${isDone(d, p) ? 'on' : ''}"></i>`).join('');
    html += `<div class="${cls.join(' ')}" data-key="${key}">${day}<span class="cal-dots">${dots}</span></div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}
document.getElementById('cal-grid').addEventListener('click', e => {
  const cell = e.target.closest('[data-key]');
  if (cell && !cell.classList.contains('future')) openDay(cell.dataset.key);
});

/* ---------- Tickets ---------- */
function ticketsOwned(p) { return S.tickets.filter(t => t.practice === p && !t.usedFor); }
function boughtThisMonth(p) {
  const ym = S.todayKey.slice(0, 7);
  return S.tickets.filter(t => t.practice === p && t.boughtOn.slice(0, 7) === ym).length;
}
function canBuy(p) {
  return computeStats().points >= CFG.TICKET_COST && boughtThisMonth(p) < CFG.TICKETS_PER_MONTH;
}

function openWallet() {
  S.sheetKey = null;
  S.walletOpen = true;
  renderWallet();
  document.getElementById('overlay').classList.add('open');
}

function renderWallet() {
  const st = computeStats();
  document.getElementById('m-title').textContent = 'Tickets';
  document.getElementById('m-date').textContent = `◆ ${st.points} points · ${CFG.TICKET_COST}◆ per ticket`;
  const rows = PRACTICES.map(p => {
    const bought = boughtThisMonth(p);
    return `<div class="wrow">
      <svg class="leg-glyph s-${p}"><use href="#g-${p}"/></svg>
      <div class="wname">${PNAME[p]}<small>bought ${bought}/${CFG.TICKETS_PER_MONTH} this month</small></div>
      <div class="wown">×${ticketsOwned(p).length}</div>
      <button class="btn-sm" onclick="buyTicket('${p}')" ${canBuy(p) ? '' : 'disabled'}>Buy · ${CFG.TICKET_COST}◆</button>
    </div>`;
  }).join('');
  document.getElementById('m-body').innerHTML = rows +
    `<div class="sheet-note">Earn ◆ from practice (1 each, +2 for a full day). To use a ticket, open a missed day in Yatra (last ${CFG.REPAIR_WINDOW_DAYS} days).</div>`;
}

function buyTicket(p) {
  if (!canBuy(p)) {
    toast(boughtThisMonth(p) >= CFG.TICKETS_PER_MONTH ? 'Monthly limit reached for this practice' : 'Not enough points yet');
    return;
  }
  if (!confirm(`Spend ${CFG.TICKET_COST}◆ on a ${PNAME[p]} ticket?`)) return;
  const t = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    practice: p, boughtOn: S.todayKey, usedFor: null, usedAt: null,
  };
  S.tickets.push(t);
  persist();
  buzz(15);
  toast('Ticket bought ✔');
  postTicket(t).then(ok => { if (!ok) toast('Saved on device · cloud sync failed'); });
  refreshAll();
}

function useTicket(key, p) {
  if (!inRepairWindow(key) || isDone(S.data[key], p)) return;
  const t = ticketsOwned(p)[0];
  if (!t) return;
  if (!confirm(`Use a ticket to mark ${PNAME[p]} done on ${shortDate(parseLocal(key))}?`)) return;

  const d = S.data[key] || { date: key, cycles: 0, shambhavi: false, bhuta: false, devi: false, restored: [] };
  d.date = key;
  if (p === 'surya') d.cycles = Math.max(d.cycles || 0, S.pickCycles);
  else d[p] = true;
  d.restored = [...new Set([...(d.restored || []), p])];
  S.data[key] = d;
  t.usedFor = key;
  t.usedAt = new Date().toISOString();
  persist();
  buzz(20);
  toast('Day restored ✔');

  Promise.all([postDay(d), postTicket(t)]).then(r => {
    if (r.includes(false)) toast('Saved on device · cloud sync failed');
  });
  refreshAll();
}

function refreshAll() {
  refreshHero();
  renderYatra();
  if (S.sheetKey) renderSheet();
  else if (S.walletOpen) renderWallet();
}

/* ============================================================
   DAY SHEET
   ============================================================ */
function openDay(key) {
  S.walletOpen = false;
  S.sheetKey = key;
  S.pickCycles = 1;
  renderSheet();
  document.getElementById('overlay').classList.add('open');
}

function renderSheet() {
  const key = S.sheetKey;
  const d = S.data[key];
  const editable = inRepairWindow(key);
  const date = parseLocal(key);

  document.getElementById('m-title').textContent = 'Day ' + dayNum(key);
  document.getElementById('m-date').textContent =
    date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  const rows = PRACTICES.map(p => {
    const on = isDone(d, p);
    const val = p === 'surya'
      ? (on ? `${d.cycles} / 3 cycles` : 'Not logged')
      : (on ? 'Completed' : 'Not logged');
    const tag = on && isRestored(d, p) ? '<span class="rest-tag">restored</span>' : '';
    let action = '';
    if (!on && editable) {
      const owned = ticketsOwned(p).length > 0;
      let picker = '';
      if (p === 'surya') {
        picker = '<span class="cyc-pick">' + [1, 2, 3].map(n =>
          `<button class="${S.pickCycles === n ? 'sel' : ''}" onclick="S.pickCycles=${n};renderSheet()">${n}</button>`).join('') + '</span>';
      }
      action = owned
        ? `${picker}<button class="btn-sm" onclick="useTicket('${key}','${p}')">Use ticket</button>`
        : `<button class="btn-sm ghost" onclick="buyTicket('${p}')" ${canBuy(p) ? '' : 'disabled'}>Buy · ${CFG.TICKET_COST}◆</button>`;
    }
    return `
    <div class="modal-row">
      <div>
        <div class="modal-label">${PNAME[p]}${tag}</div>
        <div class="modal-val" style="color:${on ? PCOLOR[p] : 'var(--light)'}">${val}</div>
      </div>
      <div class="modal-actions">${action}<div class="modal-dot" style="background:${on ? PCOLOR[p] : 'var(--muted)'}"></div></div>
    </div>`;
  }).join('');

  let note = '';
  if (key === S.todayKey) note = 'Log today from the Today tab.';
  else if (key < S.todayKey && !editable) note = `Older than ${CFG.REPAIR_WINDOW_DAYS} days — this record is sealed.`;
  else if (editable && doneCount(d) < 4) note = 'Missed something? Use a ticket to restore it. Restored practices keep your streak but earn no ◆.';

  document.getElementById('m-body').innerHTML = rows + (note ? `<div class="sheet-note">${note}</div>` : '');
}

function closeModal() {
  S.sheetKey = null;
  S.walletOpen = false;
  document.getElementById('overlay').classList.remove('open');
}
function handleOverlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(name) {
  const isHistory = name === 'history';
  document.getElementById('view-today').classList.toggle('hidden', isHistory);
  document.getElementById('view-history').classList.toggle('hidden', !isHistory);
  document.getElementById('tab-today').classList.toggle('active', !isHistory);
  document.getElementById('tab-history').classList.toggle('active', isHistory);
  if (isHistory) {
    renderYatra();
    const hs = document.getElementById('heat-scroll');
    hs.scrollLeft = hs.scrollWidth;       // open on today (right edge)
  }
}

/* ============================================================
   Header shadow — listen on the active view's scroll
   ============================================================ */
['view-today', 'view-history'].forEach(id => {
  document.getElementById(id).addEventListener('scroll', function() {
    document.getElementById('header').classList.toggle('scrolled', this.scrollTop > 8);
  }, { passive: true });
});

/* ============================================================
   PWA
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.log('SW skipped:', e.message));
  });
  // A new service worker took over → reload once so the latest version shows
  if (navigator.serviceWorker.controller) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!reloaded) { reloaded = true; location.reload(); }
    });
  }
}

init();
</script>
